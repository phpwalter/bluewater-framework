name: Refresh Composer lock

on:
  push:

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, simplexml
          coverage: none
      - run: composer update --no-interaction --prefer-dist
      - name: Emit lock file
        run: base64 -w0 composer.lock
